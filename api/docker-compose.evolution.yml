# Evolution API (WhatsApp não oficial) para desenvolvimento local.
#
# Sobe três serviços isolados do app: a Evolution API, um Postgres dedicado
# (não reutiliza o banco do Beauty Express) e um Redis para cache de sessão.
#
# Subir:   docker compose -f docker-compose.evolution.yml up -d
# Logs:    docker compose -f docker-compose.evolution.yml logs -f evolution
# Derrubar: docker compose -f docker-compose.evolution.yml down
#
# Depois de subir, ajuste o api/.env:
#   EVOLUTION_API_URL=http://localhost:8080
#   EVOLUTION_API_KEY=<o mesmo valor de AUTHENTICATION_API_KEY abaixo>
#   EVOLUTION_WEBHOOK_PUBLIC_URL=http://host.docker.internal:3000
#   EVOLUTION_WEBHOOK_TOKEN=<um segredo qualquer>
#
# IMPORTANTE (webhook em dev): a Evolution roda em container e precisa alcançar
# a sua API (que roda no host, porta 3000). No macOS/Windows use
# host.docker.internal; no Linux, use o IP do host na rede docker ou rode a API
# também em container na mesma rede.

services:
  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: beauty-evolution-api
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080

      # Autenticação: esta é a apikey global.
      # Use o MESMO valor em EVOLUTION_API_KEY no api/.env.
      AUTHENTICATION_API_KEY: beauty-evolution-key-change-me
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      # Banco dedicado da Evolution
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@evolution-postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: beauty_evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"

      # Redis (cache de sessão)
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: beauty_evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"

      # Webhook: o endpoint e o token são definidos por instância pela nossa API
      # na criação (createInstance). Aqui deixamos o global desligado.
      WEBHOOK_GLOBAL_ENABLED: "false"

      # Como o aparelho aparece ao conectar
      CONFIG_SESSION_PHONE_CLIENT: Ageendoo
      CONFIG_SESSION_PHONE_NAME: Chrome

      LOG_LEVEL: ERROR,WARN,INFO
      LOG_COLOR: "true"
    # No macOS/Windows o host.docker.internal já resolve. No Linux, descomente:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    volumes:
      - evolution_instances:/evolution/instances

  evolution-postgres:
    image: postgres:16-alpine
    container_name: beauty-evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    # Porta 5433 no host para não conflitar com o Postgres do app (5432)
    ports:
      - "5433:5432"
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 5

  evolution-redis:
    image: redis:7-alpine
    container_name: beauty-evolution-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  evolution_instances:
  evolution_postgres_data:
  evolution_redis_data:
